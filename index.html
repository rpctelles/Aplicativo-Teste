<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minhas Finanças</title>
  <meta name="description" content="Controle financeiro pessoal: receitas, gastos, contas fixas, gráficos e exportação para Excel. Funciona offline e os dados ficam no seu celular.">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="page-title">Início</h1>
      <div class="month-nav" id="month-nav">
        <button class="icon-btn" data-month-step="-1" aria-label="Mês anterior">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="month-label" id="month-label" aria-label="Voltar para o mês atual"></button>
        <button class="icon-btn" data-month-step="1" aria-label="Próximo mês">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <button class="fab" id="fab" aria-label="Novo lançamento">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="Navegação principal">
      <a href="#inicio" data-route="inicio">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </a>
      <a href="#lancamentos" data-route="lancamentos">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>Lançamentos</span>
      </a>
      <a href="#fixas" data-route="fixas">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Contas fixas</span>
        <b class="badge" id="badge-fixas" hidden></b>
      </a>
      <a href="#graficos" data-route="graficos">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Gráficos</span>
      </a>
      <a href="#mais" data-route="mais">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>Mais</span>
      </a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-content" id="sheet-content"></div>
  </section>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancelar</button>
        <button value="ok" class="btn" id="confirm-ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>

  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
